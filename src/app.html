<title>Гриф</title>
<style>
/* Layout: one-column phone app, fixed bottom tab bar; the workout screen swaps the tab bar for a rest timer.
   Block colours follow competition plates: 10 kg green, 15 kg yellow, 25 kg red, 20 kg blue, 5 kg white for light weeks.
   System fonts only, so the app looks the same with no internet. */
:root{
  --bg:#eceff3; --surface:#ffffff; --ink:#12161c; --muted:#596273; --line:#d3d8e0;
  --accent:#1d4fd0; --accent-ink:#ffffff; --ok:#17804a; --ok-bg:#e3f3ea; --warn:#a06200;
  --p-green:#2b8a52; --p-yellow:#d9a400; --p-red:#cf3626; --p-blue:#1d4fd0; --p-white:#c4cad3;
  --display:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1115; --surface:#181c22; --ink:#e8ebf0; --muted:#98a1b0; --line:#2b313b;
  --accent:#5f8dff; --accent-ink:#0b1020; --ok:#45cf83; --ok-bg:#15301f; --warn:#f0b340;
  --p-green:#3fae6c; --p-yellow:#f0c22c; --p-red:#ee5442; --p-blue:#5f8dff; --p-white:#d7dce3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1115; --surface:#181c22; --ink:#e8ebf0; --muted:#98a1b0; --line:#2b313b;
  --accent:#5f8dff; --accent-ink:#0b1020; --ok:#45cf83; --ok-bg:#15301f; --warn:#f0b340;
  --p-green:#3fae6c; --p-yellow:#f0c22c; --p-red:#ee5442; --p-blue:#5f8dff; --p-white:#d7dce3; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance}
h1{font-size:32px;line-height:1;letter-spacing:-.01em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
h3{font-size:19px;line-height:1.15}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.badge{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.weekbar{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.weekbar i{height:10px;border-radius:3px;background:var(--c);opacity:.35}
.weekbar i.past{opacity:.75}
.weekbar i.now{opacity:1;outline:2px solid var(--ink);outline-offset:1px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.chip::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c);border:1px solid var(--line)}
.btn{border-radius:12px;padding:14px 16px;font-weight:600;background:var(--surface);border:1px solid var(--line);text-align:left}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{padding:18px;font-size:18px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--p-red)}
.btn.block{width:100%}
.btn.center{text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.days{display:flex;flex-direction:column;gap:10px}
.day{display:flex;flex-direction:column;gap:4px;width:100%}
.day .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.day .t b{font-family:var(--display);font-size:22px;font-weight:800}
.day .x{font-size:14px;color:var(--muted);font-weight:400}
.next-tag{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.primary .next-tag,.primary .x{color:inherit;opacity:.85}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:4px;border-radius:12px;border:1px solid var(--line)}
.seg button{border:0;background:none;padding:10px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.toggle{display:flex;gap:12px;align-items:flex-start;font-size:15px}
.toggle input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--accent)}
/* workout */
.wk-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.wk-head .ttl{font-family:var(--display);font-size:20px;font-weight:800;line-height:1.05}
.ex{gap:8px}
.ex .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ex .grp{font-weight:700;color:var(--muted);margin-right:4px}
.tgt{font-family:var(--display);font-size:20px;font-weight:800;white-space:nowrap}
.hint{font-size:14px;color:var(--warn);font-weight:500}
.hint.up{color:var(--ok)}
.alt{font-size:14px;color:var(--muted)}
.ss{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.sets{display:flex;flex-direction:column;gap:6px}
.set,.set-h{display:grid;grid-template-columns:20px 1fr 1fr .75fr 50px;gap:6px;align-items:center}
.set-h span{font-size:12px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.06em}
.set .n{font-weight:700;color:var(--muted);text-align:center}
.set input{width:100%;min-width:0;padding:12px 4px;font-size:20px;font-weight:600;text-align:center}
.set input.rir{font-size:17px}
.set .ck{height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:22px;font-weight:700;color:var(--muted)}
.set.done input{background:var(--ok-bg);border-color:transparent}
.set.done .ck{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;font-size:15px}
.ex.complete .hd h3::after{content:" ✓";color:var(--ok)}
textarea{width:100%;padding:10px;min-height:70px}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.timer .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.timer .clock{font-family:var(--display);font-size:32px;font-weight:800;min-width:84px}
.timer .lbl{flex:1;font-size:13px;color:var(--muted);line-height:1.2;min-width:0}
.timer .bar{position:absolute;left:0;top:-1px;height:3px;background:var(--accent);width:0}
.timer.over .clock{color:var(--ok)}
.timer button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-weight:600}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;width:100%}
.tabs button{background:none;border:0;padding:10px 0;font-weight:600;font-size:13px;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--accent)}
/* history */
.sess summary{list-style:none;display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.sess summary::-webkit-details-marker{display:none}
.sess table{width:100%;border-collapse:collapse;font-size:14px}
.sess td{padding:4px 0;border-top:1px solid var(--line);vertical-align:top}
.sess td:last-child{text-align:right;padding-left:8px}
.prog{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.prog svg{display:block}
.empty{padding:24px 16px;text-align:center;color:var(--muted)}
/* program */
.exl{display:flex;flex-direction:column}
.exl .it{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.exl .it:first-child{border-top:0}
.exl .it .nm{min-width:0}
.edit{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.edit label,.lbl2{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.edit label.w{grid-column:1/-1}
.edit input,.lbl2 input{padding:10px;font-size:16px}
.edit .row{grid-column:1/-1}
.phase{display:flex;gap:10px;align-items:flex-start}
.phase .sw{flex:none;width:24px;height:24px;border-radius:50%;background:var(--c);border:1px solid var(--line);margin-top:2px}
select{padding:10px;font-size:16px}
.note{font-size:14px;color:var(--muted);line-height:1.45}
.e1{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px 8px;align-items:center;font-size:14px}
.e1 input{width:100%;min-width:0;padding:8px;font-size:16px;text-align:center}
.e1 .h{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.wtable{width:100%;border-collapse:collapse;font-size:14px}
.wtable th,.wtable td{padding:6px 4px;text-align:right;border-top:1px solid var(--line)}
.wtable th:first-child,.wtable td:first-child{text-align:left}
.wtable tr.now td{font-weight:700;color:var(--accent)}
.scroll{overflow-x:auto}
/* food */
.pbar{display:block;height:10px;border-radius:5px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok)}
.pbar.thin{height:6px}.pbar.thin i{background:var(--accent)}
.food-mini{display:flex;flex-direction:column;gap:6px}
.food-mini .x{font-size:14px;color:var(--muted);font-weight:400}
.big{font-family:var(--display);font-size:34px;font-weight:800;line-height:1}
.big small{font-size:16px;font-weight:600;color:var(--muted)}
.macros{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.macros b{color:var(--ink)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ftile{display:flex;flex-direction:column;gap:2px;text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-width:0}
.ftile b{font-size:16px}
.ftile span{font-size:13px;color:var(--muted);line-height:1.3}
.ftile:active{background:var(--ok-bg)}
.ftile.plate{border-color:var(--accent)}
.ftile.editing{border-style:dashed}
.seg.mini{padding:2px;gap:2px}.seg.mini button{padding:6px 12px}
.frow{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.frow:first-child{border-top:0}
.frow .nm{min-width:0;font-size:15px}
.xbtn{border:0;background:none;color:var(--muted);font-size:16px;padding:6px}
.step{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;font-weight:700}
.wweeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.wweeks span{display:flex;flex-direction:column;align-items:center;background:var(--bg);border-radius:10px;padding:6px 4px}
.wweeks small{font-size:12px;color:var(--muted)}
/* technique */
.tech{border-top:1px solid var(--line);padding-top:8px}
.tech summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:15px;list-style:none}
.tech summary::-webkit-details-marker{display:none}
.tech summary::after{content:" ›"}
.tech[open] summary::after{content:" ⌄"}
.tk h4{margin:10px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tk ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15px;line-height:1.4}
.tk .bad li::marker{content:"✕  ";color:var(--p-red)}
.tk .sea{margin-top:8px;font-size:14px;background:var(--bg);border-radius:10px;padding:8px 10px}
.tcard summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tcard summary::-webkit-details-marker{display:none}
.tcard summary b{font-size:17px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes flash{50%{background:var(--ok-bg)}}
.timer.over{animation:flash 1s 3}
</style>

<div id="app"></div>

<script>
/* ===== Программа 4.0: верх / низ, 4 тренировки, 12 недель (из andrey_program_12_weeks.xlsx) ===== */

const START_DEFAULT = "2026-10-12";
const BLOCKS = {
  b1:{name:"Б1 Накопление", color:"green", k:0},
  d1:{name:"Облегчённая", color:"white", k:0, light:true},
  b2:{name:"Б2 Объём", color:"yellow", k:1},
  d2:{name:"Облегчённая", color:"white", k:1, light:true},
  b3:{name:"Б3 Сила", color:"red", k:2},
  t:{name:"Тест и отдых", color:"blue", k:2, light:true, test:true}
};
const WEEKS = [
  {b:"b1", sets:3, reps:"8", pct:.72, rir:"3", note:"Вводная неделя: запас 3 повтора, чтобы проверить новые веса и упражнения."},
  {b:"b1", sets:3, reps:"8", pct:.75, rir:"2", note:"Рабочая неделя."},

  {b:"d1", sets:2, reps:"6", pct:.68, rir:"4", note:"Половина подходов, вес −10%, запас 4. В конце недели обновите e1RM на вкладке «Программа»."},
  {b:"b2", sets:4, reps:"6", pct:.76, rir:"2–3", note:"+1 подход на верх, базовые 4 × 6."},
  {b:"b2", sets:4, reps:"6", pct:.78, rir:"2", note:"Рабочая неделя."},
  {b:"b2", sets:4, reps:"5", pct:.80, rir:"2", note:"Пик объёма."},
  {b:"d2", sets:2, reps:"5", pct:.70, rir:"4", note:"Половина подходов, запас 4. В конце недели обновите e1RM."},
  {b:"b3", sets:4, reps:"5", pct:.81, rir:"2", note:"Объём как в Б1, вес выше."},
  {b:"b3", sets:4, reps:"4", pct:.84, rir:"1–2", note:"Тяжёлая неделя."},
  {b:"b3", sets:3, reps:"3", pct:.88, rir:"1–2", note:"Пиковая неделя: 3 × 3."},
  {b:"t",  sets:1, reps:"макс", pct:.85, rir:"0–1", note:"Д1 и Д2: разминка, затем 1 подход на максимум чистых повторов с 85% e1RM. Остальное облегчённо."}
];
/* Базовые: веса по неделям из листа «Основные» */
const MAIN = {
  bench:{name:"Жим лёжа", e1rm:96, plan:[70,72.5,75,65,75,77.5,80,70,82.5,85,90,87.5]},
  squat:{name:"Присед", e1rm:94, plan:[67.5,70,72.5,65,72.5,75,77.5,67.5,80,85,87.5,85]},
  rdl:{name:"Румынская тяга", e1rm:96, plan:[70,72.5,75,65,75,77.5,80,70,82.5,82.5,82.5,75]},
  pullup:{name:"Подтягивания", e1rm:104, load:[0,0,0,0,.5,.5,3,0,8,10.5,15.5,13], bw:true}
};
const DEFAULT_PROGRAM = {
  version: PROGRAM_VERSION,
  days: [
    {id:"D1", name:"Д1", title:"Верх A: жим лёжа и подтягивания", time:"60–65 мин", ex:[
      {id:"bench", grp:"1", main:true, name:"Жим штанги лёжа", rest:180, inc:2.5, note:"Главное упражнение для цели 100 кг. Лопатки сведены, пауза 0,5 с на груди."},
      {id:"pullup", grp:"2", main:true, name:"Подтягивания с отягощением", rest:150, inc:2.5, note:"Вес = вес тела + груз. Полная амплитуда, без рывка."},
      {id:"chest-row", grp:"3", name:"Тяга с упором грудью", alt:"Тяга гантели с упором в наклонную скамью", sets:[3,3,3], reps:"8–12", rir:"2", rest:120, inc:2, note:"Толщина спины. Корпус неподвижен."},
      {id:"incline", grp:"4", name:"Жим гантелей на наклоне 30°", sets:[2,3,2], reps:"8–12", rir:"2", rest:120, inc:2, note:"Старт 20–21 кг."},
      {id:"lateral", grp:"5a", name:"Махи в стороны", alt:"Махи в нижнем блоке или гантели", sets:[3,3,3], reps:"12–20", rir:"0–1", rest:0, inc:1, note:"Старт 8–9 кг."},
      {id:"oh-ext", grp:"5b", name:"Разгибание рук над головой", alt:"Канат в кроссовере", sets:[3,3,3], reps:"10–15", rir:"1", rest:90, inc:2.5, note:"Локти вверх, глубокое растяжение."},

      {id:"bulgarian", grp:"3", name:"Болгарский сплит-присед", sets:[2,3,2], reps:"8–12", rir:"2", rest:90, inc:2, note:"На каждую ногу. Вес одной гантели."},

    {id:"D3", name:"Д3", title:"Верх B: спина, плечи, руки", time:"65–70 мин", ex:[
      {id:"db-press", grp:"1", name:"Жим гантелей сидя", alt:"Гантели или жим в Смите сидя", sets:[3,3,3], reps:"6–10", rir:"2", rest:120, inc:2, note:"Старт 25 кг (25 × 6)."},
      {id:"lat-pull", grp:"2", name:"Тяга верхнего блока нейтральным хватом", sets:[3,4,3], reps:"8–12", rir:"1–2", rest:90, inc:2.5, note:"Полное растяжение наверху."},
      {id:"cg-bench", grp:"3", name:"Жим штанги лёжа узким хватом", sets:[3,3,3], reps:"6–10", rir:"2", rest:120, inc:2.5, note:"Хват на ширине плеч. Техника для 100 кг и трицепс."},

  if (m.bw) {

  const [, hi] = range(t.reps);
  const topSets = last.sets.filter(s => num(s.w) === top);
  const allHit = topSets.length >= t.sets && topSets.every(s => (num(s.r) || 0) >= hi);
  if (allHit && ex.inc) return {w: top + ex.inc, up:true, hint: `+${fmtW(ex.inc)} кг: в прошлый раз ${hi} повт. во всех подходах.`};
  return {w: top, up:false, hint: `Тот же вес: доведите до ${hi} повт. во всех подходах.`};
}
function nextDayId(){
  const ids = program.days.map(d => d.id);
  const last = sortedSessions().find(s => s.week >= 1);
  if (!last) return ids[0];
  return ids[(ids.indexOf(last.dayId) + 1) % ids.length];
}
function bestE1(exId, minWeek, maxWeek){
  let best = null;
  for (const s of S.sessions) {
    if (s.week < minWeek || s.week > maxWeek) continue;
    const e = (s.ex || []).find(x => x.id === exId); if (!e) continue;
    for (const x of e.sets) { if (!x.done || num(x.w) == null) continue; const v = e1rm(num(x.w), num(x.r), num(x.q)); if (!best || v > best) best = v; }
  }
  return best;
}

function spark(points){
  const W = 120, H = 34, p = 3;
  if (points.length < 2) return `<svg width="${W}" height="${H}" aria-hidden="true"></svg>`;
  const ys = points.map(x => x.v), mn = Math.min(...ys), mx = Math.max(...ys), span = mx - mn || 1;
  const xy = points.map((pt, i) => [p + i * (W - 2*p) / (points.length - 1), H - p - (pt.v - mn) / span * (H - 2*p)]);
  const line = xy.map((q,i) => (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1)).join(" ");
  const last = xy[xy.length - 1];
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">
    <path d="${line} L${last[0].toFixed(1)} ${H} L${p} ${H}Z" fill="var(--accent)" opacity=".12"></path>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="var(--accent)"></circle></svg>`;
}

/* ===== синхронизация с приватным репозиторием GitHub ===== */
const csvCell = v => { const t = String(v ?? ""); return /[",\n;]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
function csvText(){
  const rows = [["date","week","block","day","exercise_id","exercise","set","weight_kg","reps","rir","heavy_watch","session_note"]];
  for (const s of sortedSessions().reverse()) for (const e of s.ex || []) e.sets.forEach((x, j) => {
    if (x.done) rows.push([s.date, s.week, s.block || "", s.dayName, e.id, e.name, j + 1, num(x.w) ?? "", x.r, x.q ?? "", s.heavy ? 1 : 0, s.note || ""]);
  });
  return rows.map(r => r.map(csvCell).join(",")).join("\n") + "\n";
}
const b64 = str => { const b = new TextEncoder().encode(str); let bin = ""; for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(bin); };

class SyncError extends Error {}
async function gh(path, opts){
  const repo = (S.settings.sync.repo || "").trim().replace(/^https?:\/\/github\.com\//, "").replace(/\/$/, "");
  let r;
  try {
    r = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, Object.assign({cache: "no-store"}, opts, {headers: Object.assign({
      "Authorization": "Bearer " + LS.get("token", ""), "Accept": "application/vnd.github+json"},
      opts && opts.body ? {"Content-Type": "application/json"} : {})}));
  } catch(e) {
    if (!/github\.io$/.test(location.hostname)) throw new SyncError("Здесь синхронизация не работает: это превью. Откройте приложение с иконки на экране «Домой» (andrejs-g.github.io/grif).");
    if (navigator.onLine === false) throw new SyncError("Нет интернета. Синхронизация пройдёт, когда появится сеть.");
    throw new SyncError("GitHub не ответил (" + ((e && e.message) || "сетевая ошибка") + "). Попробуйте ещё раз через минуту.");
  }
  if (r.status === 401) throw new SyncError("Ключ доступа не подходит или истёк. Создайте новый и вставьте его.");
  if (r.status === 403) throw new SyncError("У ключа нет права записи. Нужно разрешение Contents: Read and write.");
  if (r.status === 404 && opts && opts.method === "PUT") throw new SyncError("Репозиторий не найден, или ключ к нему не допущен. Проверьте имя репозитория.");
  return r;
}
async function readFile(path){
  const r = await gh(path);
  if (r.status === 404) return null;
  if (!r.ok) throw new SyncError("GitHub ответил ошибкой " + r.status + ". Попробуйте позже.");
  const j = await r.json();
  return {sha: j.sha, text: j.content != null ? unb64(j.content) : null};
}
async function writeFile(path, text, msg){
  const cur = await readFile(path);
  if (cur && cur.text === text) return false;
  const r = await gh(path, {method: "PUT", body: JSON.stringify({message: msg, content: b64(text), sha: cur ? cur.sha : undefined})});
  if (!r.ok) throw new SyncError("Не удалось записать файл, ошибка " + r.status + ".");
  return true;
}
function applyAdjust(a){
  if (!a || typeof a !== "object") return;
  const prev = JSON.stringify(S.adjust);
  S.adjust = a; LS.set("adjust", a);
  if (a.e1rm && typeof a.e1rm === "object") for (const id of Object.keys(MAIN)) {
    const arr = a.e1rm[id]; if (!Array.isArray(arr)) continue;
    S.settings.e1rm[id] = S.settings.e1rm[id] || [null, null, null];
    arr.forEach((v, k) => { if (num(v) != null && k < 3) S.settings.e1rm[id][k] = num(v); });
  }

}
async function sync(manual){
  if (S.syncing) return;
  if (!LS.get("token", "") || !S.settings.sync.repo) { if (manual) toast("Сначала вставьте ключ доступа"); return; }
  if (!manual && navigator.onLine === false) return;
  S.syncing = true; paintSync();
  try {
    const d = todayISO();
    await writeFile("log/grif-log.json", exportText(true), "Журнал " + d);
    await writeFile("log/sets.csv", csvText(), "Подходы " + d);
    await writeFile("log/nutrition.csv", nutritionCsv(), "Питание и вес " + d);
    const a = await readFile("plan/adjustments.json");
    let fresh = false;

    S.settings.sync.last = new Date().toISOString(); S.settings.sync.error = null;

  } catch(e) {
    S.settings.sync.error = e instanceof SyncError ? e.message : "Не получилось синхронизировать: " + (e && e.message || e);

}
function daysSinceSync(){ return S.settings.sync.last ? Math.floor((Date.now() - Date.parse(S.settings.sync.last)) / 864e5) : null; }
function fmtWhen(iso){ const d = new Date(iso); return d.toLocaleDateString("ru-RU", {day:"numeric", month:"short"}) + ", " + d.toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit"}); }

function doImport(txt){

  const ids = new Set(S.sessions.map(s => s.id)); let n = 0;
  for (const s of data.sessions) if (s && s.id && !ids.has(s.id)) { S.sessions.push(s); n++; }
  if (data.food && typeof data.food === "object") for (const [d, arr] of Object.entries(data.food)) { const have = new Set((food[d] || []).map(e => e.t + e.i)); food[d] = (food[d] || []).concat((arr || []).filter(e => !have.has(e.t + e.i))); }

let audio = null;
function beep(){
  try { if (!audio) return; const t0 = audio.currentTime;
    [0, .25].forEach(o => { const os = audio.createOscillator(), g = audio.createGain(); os.frequency.value = 880; g.gain.setValueAtTime(.25, t0+o); g.gain.exponentialRampToValueAtTime(.001, t0+o+.18); os.connect(g).connect(audio.destination); os.start(t0+o); os.stop(t0+o+.2); });
  } catch(e){}
  try { navigator.vibrate && navigator.vibrate([200,100,200]); } catch(e){}
}
function startTimer(sec, label){ S.timer = {end: Date.now() + sec*1000, total: sec, label, beeped:false}; tick(); }
function tick(){
  if (S.draft) { const e = document.getElementById("elapsed"); if (e) e.textContent = Math.floor((Date.now() - S.draft.startedAt)/60000) + " мин"; }

  const T = S.timer, clock = el.querySelector(".clock"), lbl = el.querySelector(".lbl"), bar = el.querySelector(".bar");
  if (!T) { clock.textContent = "—"; lbl.textContent = "Отдых запустится, когда отметите подход"; bar.style.width = "0"; el.classList.remove("over"); return; }
  if (T.superset) { clock.textContent = "→"; lbl.textContent = "Суперсет: сразу " + T.label; bar.style.width = "0"; el.classList.remove("over"); return; }
  const left = Math.round((T.end - Date.now())/1000);
  if (left <= 0) { clock.textContent = "+" + fmtRest(-left); lbl.textContent = "Отдых окончен. Дальше: " + (T.label || ""); bar.style.width = "100%"; if (!T.beeped) { T.beeped = true; el.classList.add("over"); beep(); } }
  else { clock.textContent = fmtRest(left); lbl.textContent = "Отдых · дальше: " + (T.label || ""); bar.style.width = (100 - left / T.total * 100) + "%"; el.classList.remove("over"); }
}

function nextLabel(i, j){

  const n = ex.slice(i).find(x => x.sets.some(s => !s.done));

}

    case "plate-new": FS.builder = {id: "p" + Date.now().toString(36), name: "", items: [], edit: false}; render(); break;
    case "plate-open": { const pl = plates.find(x => x.id === b.dataset.id); if (pl) { FS.builder = Object.assign(clone(pl), {edit: true}); render(); window.scrollTo(0, 0); } break; }
    case "pl-q": { const B = FS.builder, id = b.dataset.id, d = +b.dataset.d; const it = B.items.find(e => e[0] === id); if (it) { it[1] = Math.max(0, it[1] + d); } else if (d > 0) B.items.push([id, d]); B.items = B.items.filter(e => e[1] > 0); render(); break; }
    case "pl-save": { const B = FS.builder; if (!B.items.length) { toast("Добавьте в тарелку хотя бы одну порцию"); break; } const pl = {id: B.id, name: (B.name || "Моя тарелка").trim(), items: B.items}; const k = plates.findIndex(x => x.id === pl.id); k >= 0 ? plates[k] = pl : plates.push(pl); FS.builder = null; saveFood(); render(); toast("Тарелка сохранена"); break; }
    case "pl-cancel": FS.builder = null; render(); break;
    case "pl-del": if (S.confirm === "pl-del") { plates = plates.filter(x => x.id !== FS.builder.id); FS.builder = null; S.confirm = null; saveFood(); render(); } else { S.confirm = "pl-del"; render(); armConfirm(); } break;
    case "sync-forget": if (S.confirm === "forget") { LS.set("token", null); S.confirm = null; S.settings.sync.error = null; saveAll(); render(); toast("Ключ удалён"); } else { S.confirm = "forget"; render(); armConfirm(); } break;
    case "import": {
      const f = document.getElementById("importfile").files[0], t = document.getElementById("importtext").value.trim();
      if (f) { const r = new FileReader(); r.onload = () => doImport(String(r.result)); r.readAsText(f); }
      else if (t) doImport(t); else toast("Выберите файл копии или вставьте её текст");
      break;
    }
  }
});
let confirmT = null;
function armConfirm(){ clearTimeout(confirmT); confirmT = setTimeout(() => { if (S.confirm) { S.confirm = null; const a = document.activeElement; if (!(a && /INPUT|TEXTAREA/.test(a.tagName))) render(); } }, 4000); }

document.addEventListener("input", ev => {
  const t = ev.target, f = t.dataset && t.dataset.f; if (!f) return;
  if (f === "heavy") { S.heavyWatch = t.checked; return; }
  if (f === "pl-name" && FS.builder) { FS.builder.name = t.value; return; }
  if (!S.draft) return;
  if (f === "note") { S.draft.note = t.value; saveDraft(); return; }
  if (f === "w" || f === "r" || f === "q") {
    const s = S.draft.ex[+t.dataset.i].sets[+t.dataset.j];
    s[f] = f === "w" ? (num(t.value) ?? "") : t.value.replace(/\D/g, "");
    saveDraft();
  }
});
document.addEventListener("change", ev => {
  const t = ev.target, f = t.dataset && t.dataset.f; if (!f) return;
  if (f === "heavy") { S.heavyWatch = t.checked; }
  if (f === "start" && t.value) { S.settings.startDate = t.value; saveAll(); render(); }
  if (f === "weight") { const iso = FS.day || todayISO(), v = num(t.value); if (v && v > 30 && v < 250) { weights[iso] = v; if (iso === todayISO()) S.settings.bw = v; } else if (!t.value.trim()) delete weights[iso]; saveFood(); saveAll(); render(); }
  if (f === "ptarget") { const v = parseInt(t.value); if (v > 0) { S.settings.proteinTarget = v; saveAll(); render(); } }
  if (f === "ktarget") { const v = parseInt(t.value); if (v > 0) { S.settings.kcalTarget = v; saveAll(); render(); } }
  if (f === "sync-repo") { S.settings.sync.repo = t.value.trim(); S.settings.sync.error = null; saveAll(); }
  if (f === "sync-token" && t.value.trim()) { LS.set("token", t.value.trim()); t.value = ""; S.settings.sync.error = null; saveAll(); render(); toast("Ключ сохранён на телефоне"); sync(true); }
  if (f === "bw") { const v = num(t.value); if (v) { S.settings.bw = v; saveAll(); render(); } }
  if (f === "e1") { const id = t.dataset.id, k = +t.dataset.k, v = num(t.value); S.settings.e1rm[id] = S.settings.e1rm[id] || [null,null,null]; S.settings.e1rm[id][k] = v; saveAll(); render(); toast(v ? "Веса пересчитаны" : "Вернул веса из таблицы"); }
});
document.addEventListener("toggle", ev => {
  const d = ev.target; if (!d.dataset || !d.dataset.tech) return;
  const key = (d.dataset.scope === "w" ? "w:" : "t:") + d.dataset.tech;
  d.open ? S.techOpen.add(key) : S.techOpen.delete(key);
}, true);
document.addEventListener("focusin", ev => { const t = ev.target; if (t.dataset && /^(w|r|q)$/.test(t.dataset.f || "")) setTimeout(() => { try { t.select(); } catch(e){} }, 0); });
document.addEventListener("submit", ev => {
  const f = ev.target.closest("form[data-form]"); if (!f) return;
  ev.preventDefault();
  const [di, k] = f.dataset.form.split(":"), ex = program.days.find(x => x.id === di).ex[+k], fd = new FormData(f);
  ex.name = String(fd.get("name") || ex.name).trim();
  ex.alt = String(fd.get("alt") || "").trim();
  const sets = String(fd.get("sets")).split(/[^\d]+/).filter(Boolean).map(Number);
  if (sets.length) ex.sets = [sets[0], sets[1] ?? sets[0], sets[2] ?? sets[1] ?? sets[0]];
  ex.reps = String(fd.get("reps") || ex.reps).replace("-", "–");
  ex.rir = String(fd.get("rir") || ex.rir).replace("-", "–");
  ex.rest = Math.max(0, parseInt(fd.get("rest")) || 0);
  ex.inc = num(fd.get("inc")) ?? ex.inc;
  S.edit = null; saveAll(); render(); toast("Сохранено");
});

/* ===== boot ===== */
document.body.insertAdjacentHTML("beforeend", `
<nav class="tabs" id="tabs"><div class="in">
  <button data-act="tab" data-view="home">Сегодня</button>
  <button data-act="tab" data-view="food">Еда</button>
  <button data-act="tab" data-view="history">История</button>
  <button data-act="tab" data-view="tech">Техника</button>
  <button data-act="tab" data-view="program">Программа</button>
</div></nav>
<div class="timer" id="timer" hidden><div class="bar"></div><div class="in">
  <span class="clock num">—</span><span class="lbl"></span>
  <button data-act-t="-15" aria-label="Отдых минус 15 секунд">−15</button><button data-act-t="+15" aria-label="Отдых плюс 15 секунд">+15</button><button data-act-t="stop" aria-label="Сбросить таймер">×</button>
</div></div>`);
document.getElementById("timer").addEventListener("click", ev => {
  const b = ev.target.closest("[data-act-t]"); if (!b || !S.timer) return;
  const a = b.dataset.actT;
  if (a === "stop" || S.timer.superset) S.timer = null; else { S.timer.end += (a === "+15" ? 15 : -15) * 1000; S.timer.beeped = false; }
  tick();
});
if (S.draft) S.view = "workout";
render();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
window.addEventListener("online", () => sync(false));
setTimeout(() => { const d = daysSinceSync(); if (d == null || d >= 1 || S.settings.sync.error) sync(false); }, 2000);
</script>
